name: Run Traffic Command with Playwright

on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - main # Run workflow on push to the 'main' branch

jobs:
  run-traffic-command:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16 # Specify your required Node.js version

      # Step 3: Install project dependencies
      - name: Install project dependencies
        run: npm install

      # Step 4: Install Playwright tools
      - name: Install Playwright tools
        run: npx playwright install

      # Step 5: Run the Traffic command
      - name: Run traffic command
        run: node traffic 1 https://pixelscan.net
